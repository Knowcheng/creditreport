version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: credituser
      POSTGRES_PASSWORD: creditpass
      POSTGRES_DB: creditreport
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credituser"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    environment:
      MODE: web
      DATABASE_URL: postgresql://credituser:creditpass@postgres:5432/creditreport
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OCR_URL: http://glm-ocr:8080/ocr
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    environment:
      API_BASE: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8501:8501"

  glm-ocr:
    image: glm-ocr:latest
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  uploads:
